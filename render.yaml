# render.yaml — Purplle Store Intelligence
# One-click deployment to Render.com
# Deploy at: https://dashboard.render.com/select-repo
#
# This file provisions:
#   1. purplle-api  — FastAPI web service (Docker)
#   2. purplle-db   — PostgreSQL 15 managed database (free tier)

services:
  - type: web
    name: purplle-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free               # upgrade to starter for always-on
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: purplle-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"  # allow all origins; update to specific frontend domain in production
      - key: LOG_LEVEL
        value: INFO
      - key: SALES_CSV_PATH
        value: /data/POS - sample transactionsb1e826f (5).csv
        # If this file is not present in the image, the backend will use fallback sales rows.

databases:
  - name: purplle-db
    plan: free
    databaseName: store_intel
    user: purplle
    ipAllowList: []          # allow all IPs (for free tier)
